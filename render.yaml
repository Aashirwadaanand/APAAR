# Render Blueprint Specification for SIH26263 APAAR Enrolment Integrity Platform
# Note: Persistent disks on Render require a Starter plan ($7/mo Web Service + $0.25/GB disk).
services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: apaar-integrity-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_PATH
        value: /var/data/apaar_institute.db
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        # Configured for local dev; update with custom domain if desired
        value: "http://localhost:5173,http://localhost:3000"
    disk:
      name: apaar-persistent-data
      mountPath: /var/data
      sizeGB: 1

  # ---------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: apaar-integrity-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: apaar-integrity-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
